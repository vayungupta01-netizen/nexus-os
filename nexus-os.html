/* app surfaces */
.app-pad{padding:20px}.eyebrow{font:9px var(--mono);letter-spacing:.16em;color:var(--cyan);text-transform:uppercase}.app-h1{font-size:23px;letter-spacing:-.05em;margin:7px 0 4px}.sub{font-size:11px;color:var(--muted);line-height:1.6}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat-card{padding:13px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025)}.stat-card small{font:9px var(--mono);color:var(--muted)}.stat-card strong{display:block;font-size:22px;margin-top:6px;letter-spacing:-.05em}.stat-card em{font:9px var(--mono);color:var(--green);font-style:normal}.section-title{font-size:11px;font-weight:700;margin:17px 0 10px}.activity{display:grid;gap:9px}.activity-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.02)}.activity-icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(100,230,255,.1);color:var(--cyan)}.activity-item div:nth-child(2){flex:1}.activity-item b{font-size:10px;display:block}.activity-item small{font:9px var(--mono);color:var(--muted)}.activity-item time{font:9px var(--mono);color:#71839d}

.files-layout{display:grid;grid-template-columns:145px 1fr;height:100%;min-height:270px}.files-side{border-right:1px solid var(--line);padding:14px 9px}.files-side button{width:100%;text-align:left;border:0;background:transparent;padding:9px;border-radius:6px;color:#94a7c0;font-size:10px}.files-side button.selected,.files-side button:hover{background:rgba(100,230,255,.09);color:var(--cyan)}.files-main{padding:17px}.file-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.file-toolbar b{font-size:12px}.small-btn,.primary-btn{border:1px solid var(--line);background:rgba(100,230,255,.08);border-radius:7px;padding:7px 10px;color:var(--cyan);font-size:10px}.small-btn:hover,.primary-btn:hover{background:rgba(100,230,255,.16)}.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:9px}.file-tile{padding:13px 7px;border:1px solid transparent;border-radius:8px;text-align:center;background:rgba(255,255,255,.025);cursor:pointer}.file-tile:hover{border-color:var(--line);background:rgba(100,230,255,.06)}.file-tile i{display:block;font-style:normal;font-size:24px;margin-bottom:8px}.file-tile span{font-size:9px;color:#b9c7d9;word-break:break-word}.note-area{width:100%;height:100%;min-height:260px;resize:none;background:transparent;border:0;color:#cbd8e9;padding:19px;font:12px/1.8 var(--mono);outline:none}.note-status{position:absolute;bottom:12px;right:15px;font:9px var(--mono);color:var(--green)}
.browser-bar{display:flex;gap:7px;padding:11px;border-bottom:1px solid var(--line)}.browser-url{flex:1;min-width:0;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:#a9bdd5;font:10px var(--mono)}.browser-page{padding:25px;text-align:center}.browser-logo{font-size:34px;color:var(--cyan);margin:16px}.browser-page h2{font-size:23px;letter-spacing:-.05em}.browser-page p{font-size:11px;color:var(--muted);line-height:1.7;max-width:380px;margin:8px auto 20px}.browser-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:left}.browser-card{padding:12px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.025)}.browser-card b{font-size:10px;display:block;margin-bottom:5px}.browser-card small{font-size:9px;color:var(--muted);line-height:1.5}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.settings-row b{font-size:11px;display:block}.settings-row small{font-size:9px;color:var(--muted)}.switch{width:34px;height:19px;border:0;border-radius:20px;background:#26354b;padding:2px}.switch:after{content:"";display:block;width:15px;height:15px;border-radius:50%;background:#8294ac;transition:.2s}.switch.on{background:rgba(100,230,255,.35)}.switch.on:after{transform:translateX(15px);background:var(--cyan)}
.about-hero{text-align:center;padding:30px 15px 20px}.about-mark{width:68px;height:68px;border:1px solid var(--cyan);border-radius:20px;display:grid;place-items:center;margin:auto;color:var(--cyan);font-size:30px;box-shadow:0 0 35px rgba(100,230,255,.15)}.about-hero h2{font-size:24px;letter-spacing:.15em;margin:17px 0 4px}.about-hero p{font:9px var(--mono);color:var(--muted);letter-spacing:.12em}.about-copy{max-width:390px;margin:auto;text-align:center;color:#9bacbf;font-size:11px;line-height:1.8;padding:0 18px 24px}
@media(max-width:700px){.top-center{display:none}.topbar{padding:0 12px}.top-right{gap:8px}.desktop-icons{left:10px;top:48px;gap:8px}.desk-icon{width:62px;font-size:9px}.desk-icon .glyph{width:37px;height:35px}.widget-stack{right:10px;top:14px;width:165px}.widget{padding:10px}.clock{font-size:23px}.widget:nth-child(2){display:none}.desktop-label{left:13px}.window{left:8px!important;top:8px!important;width:calc(100% - 16px)!important;height:calc(100% - 16px)!important;min-width:0}.dock-wrap{gap:4px;padding:7px}.dock-app{width:35px;height:36px}.start-menu{width:calc(100% - 24px)}.stat-grid{gap:6px}.stat-card{padding:9px}.stat-card strong{font-size:18px}.files-layout{grid-template-columns:105px 1fr}.browser-cards{grid-template-columns:1fr}.desktop{bottom:62px}}

</style>

<body>
<div class="wallpaper"><canvas id="stars"></canvas><div class="orb one"></div><div class="orb two"></div></div>
<header class="topbar">
  <div class="brand"><span class="brand-mark">⌘</span> NEXUS <small>OS / 01</small></div>
  <div class="top-center">PERSONAL COMPUTING ENVIRONMENT</div>
  <div class="top-right"><span><i class="status-dot"></i>ALL SYSTEMS NOMINAL</span><button class="top-icon" id="quickSettings" title="Settings">⚙</button><span id="topClock">--:--</span></div>
</header>
<main class="desktop" id="desktop">
  <div class="desktop-label">WORKSPACE / ALPHA</div>
  <div class="desktop-icons">
    <button class="desk-icon" data-app="files"><span class="glyph">▤</span>Files</button>
    <button class="desk-icon" data-app="terminal"><span class="glyph">⌁</span>Terminal</button>
    <button class="desk-icon" data-app="notes"><span class="glyph">▧</span>Notes</button>
    <button class="desk-icon" data-app="browser"><span class="glyph">◎</span>Browser</button>
  </div>
  <aside class="widget-stack">
    <section class="widget"><div class="widget-head"><span>LOCAL TIME</span><b>● LIVE</b></div><div class="clock" id="widgetClock">00:00:00</div><div class="date" id="widgetDate">LOADING DATE...</div><div class="metric-row"><span>Timezone</span><strong id="timezone">LOCAL</strong></div></section>
    <section class="widget"><div class="widget-head"><span>DEVICE TELEMETRY</span><b>SIMULATED</b></div><div class="system-row"><span>CPU</span><div class="bar"><i style="width:34%"></i></div><small>34%</small></div><div class="system-row"><span>MEM</span><div class="bar"><i style="width:62%"></i></div><small>62%</small></div><div class="system-row"><span>NET</span><div class="bar"><i style="width:21%"></i></div><small>21%</small></div><div class="metric-row"><span>Core status</span><strong>OPTIMAL</strong></div><div class="mini-bars" id="miniBars"></div></section>
  </aside>
  <div class="window-layer" id="windowLayer"></div>
</main>
<div class="start-menu" id="startMenu">
  <div class="start-top"><strong>Launch application</strong><small>NEXUS / APP GRID</small></div>
  <input class="searchbox" id="appSearch" placeholder="⌕  Search applications..." autocomplete="off">
  <div class="start-grid" id="startGrid"></div>
  <div class="start-foot"><span>SESSION: LOCAL-01</span><span>BUILD 26.11.06</span></div>
</div>

  <button class="dock-app" data-app="start" title="Launchpad">⌘</button><span class="dock-sep"></span>
  <button class="dock-app" data-app="files" title="Files">▤</button>
  <button class="dock-app" data-app="terminal" title="Terminal">⌁</button>
  <button class="dock-app" data-app="notes" title="Notes">▧</button>
  <button class="dock-app" data-app="browser" title="Browser">◎</button>
  <button class="dock-app" data-app="monitor" title="System monitor">◫</button>
  <span class="dock-sep"></span><button class="dock-app" data-app="settings" title="Settings">⚙</button>
  <button class="dock-app power" data-app="power" title="Power">⏻</button>
</nav>
<div class="toast-area" id="toastArea"></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const layer = $('#windowLayer'), menu = $('#startMenu'), toastArea = $('#toastArea');
let zTop = 20, winCount = 0, activeWindow = null;
const apps = [
 {id:'overview',name:'System overview',icon:'◈',symbol:'◈'},
 {id:'files',name:'File explorer',icon:'▤',symbol:'▤'},
 {id:'terminal',name:'Terminal',icon:'⌁',symbol:'⌁'},
 {id:'notes',name:'Notes',icon:'▧',symbol:'▧'},
 {id:'browser',name:'Nexus browser',icon:'◎',symbol:'◎'},
 {id:'monitor',name:'System monitor',icon:'◫',symbol:'◫'},
 {id:'settings',name:'Settings',icon:'⚙',symbol:'⚙'},
 {id:'about',name:'About Nexus',icon:'✧',symbol:'✧'}
];
const appWindows = new Map();
function toast(title,msg){const el=document.createElement('div');el.className='toast';el.innerHTML=`<b>${esc(title.toUpperCase())}</b><span>${esc(msg)}</span>`;toastArea.append(el);setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(12px)';setTimeout(()=>el.remove(),250)},3200)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openApp(id){
 if(id==='start'){menu.classList.toggle('show');$('#appSearch').focus();return}
 if(id==='power'){toast('Power controls','NEXUS OS session is running in demo mode.');return}
 menu.classList.remove('show');
 if(appWindows.has(id)){const w=appWindows.get(id);w.style.display='flex';focusWindow(w);return}
 const app=apps.find(a=>a.id===id);if(!app)return;
 const w=document.createElement('section');w.className='window';w.dataset.app=id;
 const offset=(winCount++%5)*24;
 w.style.left=`${Math.max(100,Math.min(innerWidth-680,180+offset))}px`;
 w.style.top=`${Math.max(75,Math.min(innerHeight-520,85+offset))}px`;
 w.style.zIndex=++zTop;
 w.innerHTML=`<div class="titlebar"><div class="window-title"><span class="app-symbol">${app.symbol}</span>${app.name.toUpperCase()}</div><div class="window-controls"><button class="win-btn minimize" title="Minimize">—</button><button class="win-btn maximize" title="Maximize">□</button><button class="win-btn close" title="Close">×</button></div></div><div class="window-body">${renderApp(id)}</div>`;
 layer.append(w);appWindows.set(id,w);focusWindow(w);wireWindow(w,id);updateDock();
 if(id==='terminal')$('#terminalInput')?.focus();
 if(id==='notes')loadNotes();
 if(id==='monitor')startMonitor(w);
}
function focusWindow(w){activeWindow=w;document.querySelectorAll('.window').forEach(x=>x.classList.remove('active'));w.classList.add('active');w.style.zIndex=++zTop}
function closeWindow(w){appWindows.delete(w.dataset.app);w.remove();if(activeWindow===w)activeWindow=null;updateDock()}
function wireWindow(w,id){
 w.addEventListener('pointerdown',()=>focusWindow(w));
 w.querySelector('.close').onclick=()=>closeWindow(w);
 w.querySelector('.minimize').onclick=()=>{w.style.display='none';updateDock()};
 w.querySelector('.maximize').onclick=()=>{w.classList.toggle('maximized');if(!w.classList.contains('maximized')){w.style.width='640px';w.style.height='430px'}};
 const bar=w.querySelector('.titlebar');let drag=null;
 bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||w.classList.contains('maximized'))return;focusWindow(w);drag={x:e.clientX-w.offsetLeft,y:e.clientY-w.offsetTop};bar.setPointerCapture(e.pointerId)});
 bar.addEventListener('pointermove',e=>{if(!drag)return;w.style.left=Math.max(0,Math.min(innerWidth-w.offsetWidth,e.clientX-drag.x))+'px';w.style.top=Math.max(54,Math.min(innerHeight-90,e.clientY-drag.y))+'px'});
 bar.addEventListener('pointerup',()=>drag=null);bar.addEventListener('pointercancel',()=>drag=null);
 if(id==='terminal')wireTerminal(w);
 if(id==='notes')w.querySelector('textarea').addEventListener('input',e=>{localStorage.setItem('nexus-notes',e.target.value);w.querySelector('.note-status').textContent='● SAVED LOCALLY'});
 if(id==='browser')w.querySelector('#browserGo').onclick=()=>toast('Nexus browser','This is an offline interface demo. External browsing is not enabled.');
 if(id==='settings')wireSettings(w);
 if(id==='files')w.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{w.querySelectorAll('[data-folder]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');w.querySelector('#folderTitle').textContent=b.dataset.folder.toUpperCase()});
}
function updateDock(){document.querySelectorAll('.dock-app[data-app]').forEach(b=>{const w=appWindows.get(b.dataset.app);b.classList.toggle('open',!!w&&w.style.display!=='none')})}
function renderApp(id){
 if(id==='overview')return `<div class="app-pad"><div class="eyebrow">Command dashboard / 01</div><h1 class="app-h1">Good to see you, Operator.</h1><p class="sub">Your workspace is online. Here's the current state of your NEXUS environment.</p><div class="stat-grid"><div class="stat-card"><small>SESSION UPTIME</small><strong id="uptime">00:00</strong><em>● ACTIVE</em></div><div class="stat-card"><small>ACTIVE PROCESSES</small><strong>08</strong><em>+2 THIS SESSION</em></div><div class="stat-card"><small>STORAGE USED</small><strong>24<span style="font-size:12px">%</span></strong><em>WITHIN LIMITS</em></div></div><div class="section-title">Recent activity</div><div class="activity"><div class="activity-item"><span class="activity-icon">▤</span><div><b>Workspace initialized</b><small>Core services are ready</small></div><time>NOW</time></div><div class="activity-item"><span class="activity-icon">⌁</span><div><b>Terminal subsystem online</b><small>Local command interpreter ready</small></div><time>1M AGO</time></div><div class="activity-item"><span class="activity-icon">✧</span><div><b>Visual engine loaded</b><small>Interface rendering nominal</small></div><time>2M AGO</time></div></div></div>`;
 if(id==='terminal')return `<div class="terminal"><div class="term-output" id="termOutput"><span style="color:#64e6ff">NEXUS TERMINAL [Version 26.11.06]</span><br>Copyright (c) NEXUS Systems. All rights reserved.<br><span class="term-help">Type "help" to view available commands.</span><br><br></div><div class="term-line"><span class="term-prompt">operator@nexus:~$</span><input class="term-input" id="terminalInput" autocomplete="off" spellcheck="false" aria-label="Terminal command"></div></div>`;
 if(id==='files')return `<div class="files-layout"><aside class="files-side"><button class="selected" data-folder="Home">⌂ &nbsp; Home</button><button data-folder="Desktop">▧ &nbsp; Desktop</button><button data-folder="Documents">▤ &nbsp; Documents</button><button data-folder="Downloads">↓ &nbsp; Downloads</button><button data-folder="Projects">◇ &nbsp; Projects</button></aside><div class="files-main"><div class="file-toolbar"><b id="folderTitle">HOME</b><button class="small-btn" id="newFolder">＋ New folder</button></div><div class="file-grid" id="fileGrid"><div class="file-tile"><i>📁</i><span>Projects</span></div><div class="file-tile"><i>📁</i><span>Documents</span></div><div class="file-tile"><i>📁</i><span>Downloads</span></div><div class="file-tile"><i>📄</i><span>readme.txt</span></div><div class="file-tile"><i>◇</i><span>nexus.config</span></div><div class="file-tile"><i>🖼</i><span>wallpaper.png</span></div></div></div></div>`;
 if(id==='notes')return `<textarea class="note-area" placeholder="Start capturing your thoughts..."></textarea><span class="note-status">● LOCAL NOTES</span>`;
 if(id==='browser')return `<div class="browser-bar"><span style="color:#8295ad;padding:7px">←</span><span style="color:#8295ad;padding:7px">→</span><input class="browser-url" value="nexus://home" aria-label="Address bar"><button class="small-btn" id="browserGo">GO</button></div><div class="browser-page"><div class="browser-logo">◈</div><div class="eyebrow">A new space to explore</div><h2>Navigate beyond.</h2><p>Nexus Browser is a concept interface. This local demo keeps your experience self-contained and does not connect to external websites.</p><div class="browser-cards"><div class="browser-card"><b>◫ &nbsp; Workspace</b><small>Pick up where you left off.</small></div><div class="browser-card"><b>⌁ &nbsp; Developer hub</b><small>Tools for curious minds.</small></div><div class="browser-card"><b>✧ &nbsp; Discover</b><small>Ideas start with exploration.</small></div></div></div>`;
 if(id==='monitor')return `<div class="app-pad"><div class="eyebrow">Performance / telemetry</div><h1 class="app-h1">System monitor</h1><p class="sub">Illustrative telemetry for the NEXUS interface. These figures are simulated, not hardware readings.</p><div class="stat-grid"><div class="stat-card"><small>CPU LOAD</small><strong id="cpuVal">34%</strong><em>SIMULATED</em></div><div class="stat-card"><small>MEMORY</small><strong id="memVal">62%</strong><em>SIMULATED</em></div><div class="stat-card"><small>NETWORK</small><strong id="netVal">21%</strong><em>SIMULATED</em></div></div><div class="section-title">Resource activity</div><div id="monitorBars" style="height:140px;display:flex;align-items:end;gap:5px;padding:10px;border-bottom:1px solid var(--line)"></div><div class="metric-row"><span>Kernel status</span><strong>STABLE</strong></div></div>`;
 if(id==='settings')return `<div class="app-pad"><div class="eyebrow">Preferences / environment</div><h1 class="app-h1">Settings</h1><p class="sub">Tune your local NEXUS experience.</p><div class="settings-row"><div><b>Ambient starfield</b><small>Show animated background particles</small></div><button class="switch on" data-setting="stars" aria-label="Toggle starfield"></button></div><div class="settings-row"><div><b>Desktop widgets</b><small>Show clock and telemetry panels</small></div><button class="switch on" data-setting="widgets" aria-label="Toggle widgets"></button></div><div class="settings-row"><div><b>Interface glow</b><small>Enable luminous interface accents</small></div><button class="switch on" data-setting="glow" aria-label="Toggle glow"></button></div><div class="settings-row"><div><b>Motion effects</b><small>Enable window and background animation</small></div><button class="switch on" data-setting="motion" aria-label="Toggle motion"></button></div><div class="section-title">System information</div><p class="sub">NEXUS OS 1.0.0 · Web runtime · Local session · No account required</p></div>`;
 if(id==='about')return `<div class="about-hero"><div class="about-mark">⌘</div><h2>NEXUS OS</h2><p>COMMAND BEYOND LIMITS · VERSION 1.0.0</p></div><div class="about-copy">A browser-based operating system concept built as a single self-contained HTML experience. Explore the desktop, launch apps, move windows, and make the interface your own.<br><br><span style="color:#64e6ff">DESIGNED FOR THE CURIOUS.</span></div>`;
 return '';
}
function loadNotes(){const w=appWindows.get('notes');if(w)w.querySelector('textarea').value=localStorage.getItem('nexus-notes')||''}
function wireTerminal(w){const input=w.querySelector('#terminalInput'),out=w.querySelector('#termOutput');const commands={help:'Available commands:\\n  help       Show this command list\\n  date       Display local date and time\\n  whoami     Display current operator\\n  status     Show simulated system status\\n  clear      Clear terminal output\\n  apps       List installed applications\\n  theme      Display active visual profile\\n  echo       Print a message\\n  reboot     Simulate a soft restart',whoami:'operator@nexus — LOCAL SESSION',status:'CORE: ONLINE\\nMEMORY: 62% (SIMULATED)\\nNETWORK: CONNECTED (LOCAL)\\nSECURITY: NOMINAL',apps:'FILES  TERMINAL  NOTES  BROWSER\\nMONITOR  SETTINGS  ABOUT',theme:'NEBULA / CYAN PHOTON / GRID-01'};
 input.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const raw=input.value.trim(),[cmd,...args]=raw.split(' ');if(!raw)return;const line=document.createElement('div');line.innerHTML=`<span class="term-prompt">operator@nexus:~$</span> ${esc(raw)}`;out.append(line);let result='';if(cmd==='clear'){out.innerHTML=''}else if(cmd==='date')result=new Date().toString();else if(cmd==='echo')result=args.join(' ');else if(cmd==='reboot'){result='Soft restart sequence initiated...';setTimeout(()=>toast('NEXUS CORE','Restart simulation complete.'),800)}else result=commands[cmd]??`Command not found: ${cmd}. Type "help" for available commands.`;if(result){const r=document.createElement('div');r.style.color='#9bb2c9';r.style.whiteSpace='pre-wrap';r.textContent=result;out.append(r)}out.append(document.createElement('br'));out.scrollTop=out.scrollHeight;input.value='';});}
function wireSettings(w){w.querySelectorAll('[data-setting]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');const key=b.dataset.setting,on=b.classList.contains('on');if(key==='stars')$('#stars').style.opacity=on?'.7':'0';if(key==='widgets')$('.widget-stack').style.display=on?'grid':'none';if(key==='glow')document.documentElement.style.setProperty('--shadow',on?'0 24px 80px rgba(0,0,0,.42)':'0 14px 35px rgba(0,0,0,.3)');if(key==='motion')document.documentElement.style.setProperty('--motion',on?'1':'0');toast('Preferences updated',`${key} ${on?'enabled':'disabled'}.`);});}
function startMonitor(w){const bars=w.querySelector('#monitorBars');for(let i=0;i<22;i++){const b=document.createElement('i');b.style.cssText=`flex:1;height:${15+Math.random()*75}%;border-radius:3px 3px 0 0;background:linear-gradient(var(--cyan),rgba(100,139,255,.2));opacity:.65`;bars.append(b)}}
function updateDock(){document.querySelectorAll('.dock-app[data-app]').forEach(b=>{const w=appWindows.get(b.dataset.app);b.classList.toggle('open',!!w&&w.style.display!=='none')})}
document.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app)));
$('#quickSettings').onclick=()=>openApp('settings');
function buildStart(){const grid=$('#startGrid');grid.innerHTML=apps.map(a=>`<button class="start-item" data-launch="${a.id}"><i>${a.icon}</i>${a.name}</button>`).join('');grid.querySelectorAll('[data-launch]').forEach(b=>b.onclick=()=>openApp(b.dataset.launch))}
buildStart();$('#appSearch').addEventListener('input',e=>{const q=e.target.value.toLowerCase();$('#startGrid').querySelectorAll('.start-item').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?'grid':'none')});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#startMenu')&&!e.target.closest('[data-app="start"]'))menu.classList.remove('show')});
function tick(){const d=new Date(),time=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});$('#widgetClock').textContent=time;$('#topClock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});$('#widgetDate').textContent=d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric',year:'numeric'}).toUpperCase();$('#timezone').textContent=Intl.DateTimeFormat().resolvedOptions().timeZone.split('/').pop().toUpperCase().replaceAll('_',' ')}
tick();setInterval(tick,1000);
for(let i=0;i<20;i++){const b=document.createElement('i');b.style.height=(15+Math.random()*85)+'%';$('#miniBars').append(b)}
// Starfield canvas
const canvas=$('#stars'),ctx=canvas.getContext('2d');let stars=[];
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);stars=Array.from({length:Math.min(150,Math.floor(innerWidth/8))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.3+.2,a:Math.random()*.65+.15,s:Math.random()*.18+.025}))}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);for(const p of stars){p.y-=p.s;if(p.y<0){p.y=innerHeight;p.x=Math.random()*innerWidth}ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(177,216,255,${p.a})`;ctx.fill()}requestAnimationFrame(draw)}
addEventListener('resize',resize);resize();draw();
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openApp('start')}if(e.key==='Escape')menu.classList.remove('show')});
openApp('overview');toast('Welcome to NEXUS OS','Your workspace is initialized and ready.');
})();
</script>
</body>
</html>
